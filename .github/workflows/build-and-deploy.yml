name: Build & Deploy Hybrid Studio (Web App + Android APK)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-build"
  cancel-in-progress: false

jobs:
  # =====================================================================
  # JOB 1: Live Online Web App (GitHub Pages Deployment)
  # =====================================================================
  deploy-web:
    name: 🌐 Deploy Live Web Studio (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: ⚡ Build Static Web Studio
        run: npm run build

      - name: ⚙️ Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 📤 Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # =====================================================================
  # JOB 2: Automated Android APK (Capacitor + Gradle Build)
  # =====================================================================
  build-apk:
    name: 📱 Build Automated Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: ⚡ Build Web Assets
        run: npm run build

      - name: 🔄 Sync Capacitor Android
        run: npx cap sync android

      - name: 🔨 Build Debug APK with Gradle
        run: |
          cd android
          gradle wrapper --gradle-version 8.2.1
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 📤 Upload APK as Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTShortClipper-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: 🏷️ Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v2.1.0-release"
          name: "YT Short Clipper V2.1.0 (Android APK & Online Studio)"
          body: |
            ## 🚀 Automated Build Release - YT Short Clipper V2 Studio
            - **Native Android APK**: Download `app-debug.apk` below and install directly on your phone.
            - **Live Web Studio**: Open directly from GitHub Pages without installing anything.
            - **On-Device Whisper AI**: Zero API keys needed; 100% on-device WebGPU/WASM transcription.
            - **Device GPU 9:16 Canvas Rendering**: Hardware-accelerated MP4 export with animated captions.
            - **Direct YouTube Channel Upload**: Client-side OAuth 2.0 GIS flow.
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
